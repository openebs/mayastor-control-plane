[package]
name = "event-consumer"
description = "NATS event consumer — connects to a NATS server and forwards raw events over an async channel"
version = "0.1.0"
edition = "2021"

[features]
default = ["rls-ring"]
rls-aws-lc-rs = ["async-nats/aws-lc-rs"]
rls-ring = ["async-nats/ring"]

[dependencies]
async-nats = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["time", "macros", "rt"] }
futures = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
events-api = { path = "../dependencies/apis/events", default-features = false }
url = { workspace = true }
