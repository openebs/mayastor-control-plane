name: Integration CI
on:
  workflow_call:
  push:
    branches:
      - ci-army

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  int-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [cncf-ubuntu-16-64-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - run: echo "CI_REPORT_START_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

      - name: Configure Docker logging driver
        run: |
          echo '{"log-driver": "journald"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./shell.nix
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          hide_cachix_token: true
          rust_cache: true

      - name: Build rust binaries
        run: nix-shell --run "cargo build --bins"

      # debugging
      - name: Setup tmate session
        if: ${{ failure() }}
        timeout-minutes: 120
        uses: mxschmitt/action-tmate@v3
