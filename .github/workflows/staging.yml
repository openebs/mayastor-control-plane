name: Staging Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v4.2.0)'
        required: true
        type: string

env:
  TAG: ${{ inputs.tag }}
  CI: 1

jobs:
  preflight-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./utils/dependencies/scripts/staging/shell.nix
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate if the staging should be even made
        run: |
          nix-shell ./utils/dependencies/scripts/staging/shell.nix \
          --pure \
          --keep CI \
          --keep TAG \
          --run "./utils/dependencies/scripts/staging/validate.sh \
            --tag ${{ env.TAG }} \
            --type staging"

  build-images:
    uses: ./.github/workflows/image.yml
    needs: preflight-checks
    with:
      tag: ${{ inputs.tag }}
      registry: ghcr.io
      namespace: mayastor/dev
    secrets: inherit
