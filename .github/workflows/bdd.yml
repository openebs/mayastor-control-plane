name: BDD CI
on:
  workflow_call:
    inputs:
      io-engine-img:
        required: false
        description: "The io-engine image to use for the tests. If not provided, the default image will be used."
        type: string
      fio-spdk-img:
        required: false
        description: "The fio_spdk image to use for the tests. If not provided, the default image will be used."
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  bdd-tests:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - cncf-ubuntu-16-64-x86
          - cncf-ubuntu-16-64-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - run: echo "CI_REPORT_START_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

      - name: Set container image overrides
        run: |
          if [ -n "${{ inputs.io-engine-img }}" ]; then
            echo "IO_ENGINE_IMAGE=${{ inputs.io-engine-img }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.fio-spdk-img }}" ]; then
            echo "FIO_SPDK_IMAGE=${{ inputs.fio-spdk-img }}" >> $GITHUB_ENV
          fi

      - name: Configure Docker logging driver
        run: |
          echo '{"log-driver": "journald"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./shell.nix
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          hide_cachix_token: true
          rust_cache: true

      - name: Build binaries
        run: nix-shell --run "cargo build --bins"

      - name: Setup Test Pre-Requisites
        run: |
          sudo debconf-communicate <<< "set man-db/auto-update false" || true
          sudo dpkg-reconfigure man-db || true
          sudo sysctl -w vm.nr_hugepages=3072
          sudo apt-get update || (sleep 5; sudo apt-get update)
          sudo apt-get install linux-modules-extra-$(uname -r)
          sudo modprobe nvme_tcp
          # Check if nvme config is valid, otherwise apply it
          sudo ./utils/dependencies/scripts/nvme-conf.sh --check --apply --overwrite

      - name: Run BDD Tests
        run: |
          nix-shell --run "deployer start --image-pull-policy always -w 60s && deployer stop"
          nix-shell --run "./scripts/python/test.sh"

      - name: Cleanup
        if: always()
        run: |
          nix-shell --run "./scripts/ci-report.sh"
          nix-shell --run "./scripts/python/test-residue-cleanup.sh"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ci-report-bdd-${{ matrix.runner }}
          path: ./ci-report/ci-report.tar.gz

      - name: Pytest BDD Report
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: ci-report/bdd-report.xml
          summary: true
          display-options: a
          fail-on-empty: true
          title: Test results

      # debugging
      # - name: Setup tmate session
      #   if: ${{ failure() }}
      #   timeout-minutes: 240
      #   uses: mxschmitt/action-tmate@v3
