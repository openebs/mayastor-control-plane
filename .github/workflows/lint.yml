name: Linter CI
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: cachix/install-nix-action@v31.10.6
      - name: Pre-populate nix-shell
        run: |
          export NIX_PATH=nixpkgs=$(jq '.nixpkgs.url' nix/sources.json -r)
          echo "NIX_PATH=$NIX_PATH" >> $GITHUB_ENV
          nix-shell --run "echo" shell.nix
      - name: Rustc for Rust dependencies caching
        run: |
          nix-shell --pure --run 'dirname "$(command -v rustc)" > rustc' shell.nix
          echo "PATH=$(cat rustc):$PATH" >> $GITHUB_ENV
      - name: Handle Rust dependencies caching
        uses: Swatinem/rust-cache@v2
      - name: Lint rust code
        run: nix-shell --run "./scripts/rust/linter.sh"
      - name: Lint python code
        run: nix-shell --run "black --diff --check tests/bdd/"
      - name: Lint nix code
        run: nix-shell --run "nixpkgs-fmt --check ."
      - name: Ensure Cargo.lock is up to date
        run: |
          if git diff --name-only | grep -q 'Cargo.lock'; then
            echo "Cargo.lock is not up to date!"
            exit 1
          fi
