name: Linter CI
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CI: 1

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./shell.nix
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          rust_cache: true
      - name: Lint rust code
        run: nix-shell --run "./scripts/rust/linter.sh"
      - name: Lint python code
        run: nix-shell --run "black --diff --check tests/bdd/"
      - name: Lint nix code
        run: nix-shell --run "nixpkgs-fmt --check ."
      - name: Ensure Cargo.lock is up to date
        run: |
          if git diff --name-only | grep -q 'Cargo.lock'; then
            echo "Cargo.lock is not up to date!"
            exit 1
          fi
