syntax = "proto3";

import "v1/misc/common.proto";
import "google/protobuf/duration.proto";

package v1.dr;

// Service for the disaster recovery agent.
//
// One surface for the agent: the liveness probe every service here has, the cluster pairs
// it holds, and the volumes replicated over them. Failover joins them as it is built.
service DrGrpc {
  // Liveness probe.
  rpc Probe (ProbeRequest) returns (ProbeResponse) {}
  // Create a pair, or adopt one that already exists under the same id.
  rpc CreateClusterPair (CreateClusterPairRequest) returns (ClusterPairReply) {}
  // Fetch a single pair.
  rpc GetClusterPair (GetClusterPairRequest) returns (ClusterPairReply) {}
  // Fetch every pair this cluster holds.
  rpc ListClusterPairs (ListClusterPairsRequest) returns (ClusterPairsReply) {}
  // Remove a pair.
  rpc DestroyClusterPair (DestroyClusterPairRequest) returns (DestroyClusterPairReply) {}
  // Enable replication on a volume, or amend the policy of one already enabled.
  rpc EnableVolume (EnableVolumeRequest) returns (VolumeReply) {}
  // Fetch a single volume's entry.
  rpc GetVolume (GetVolumeRequest) returns (VolumeReply) {}
  // Fetch every volume's entry.
  rpc ListVolumes (ListVolumesRequest) returns (VolumesReply) {}
  // Disable replication on a volume.
  rpc DisableVolume (DisableVolumeRequest) returns (DisableVolumeReply) {}
}

// Liveness probe request.
message ProbeRequest {
  // Intentionally empty: readiness is the service answering at all.
}

// Liveness probe response.
message ProbeResponse {
  // Whether the agent is ready to serve.
  bool ready = 1;
}

// Keys for a store, carried by the pair. Both or neither: half a credential signs nothing.
message S3Keys {
  // Access key id to sign requests to the store with.
  string access_key = 1;
  // Secret access key the signature is computed with. Empty when a reply is withholding
  // it, which a request is refused for carrying.
  string secret_key = 2;
}

// Credentials the agent holds rather than the pair, named so the pair can say which.
//
// A message rather than a bare string so that what identifies a credential can grow -
// a scope, a provider - without the variant changing shape.
message NamedCredentials {
  // The name the agent resolves against its own environment.
  string name = 1;
}

// Where the agent gets the credentials for a store.
//
// Absent on the transport means the agent's own environment, which cannot serve two
// stores at once - a name can, by saying which of the agent's credentials to use without
// any of them being written here.
message S3Credentials {
  // Exactly one of these says where the credentials come from.
  oneof credentials {
    // Keys carried by the pair, used for this store alone.
    S3Keys keys = 1;
    // Credentials the agent holds, named by the pair.
    NamedCredentials named = 2;
  }
}

// An S3-compatible object store both clusters can reach.
message S3Transport {
  // Endpoint URL of the store.
  string endpoint = 1;
  // Bucket the relationships live in.
  string bucket = 2;
  // Key prefix within the bucket, when it is shared with something else.
  optional string prefix = 3;
  // Region the bucket lives in. Signatures are scoped to it, and stores differ on whether
  // they enforce that.
  optional string region = 4;
  // How the agent authenticates. Absent means its own environment.
  optional S3Credentials credentials = 5;
}

// Where a relationship's store lives, and how it is reached.
message Transport {
  // Exactly one of these says how the two clusters exchange data.
  oneof transport {
    // An s3-compatible object store both clusters can reach.
    S3Transport s3 = 1;
  }
}

// The pairing of this cluster with a peer, and the store they share.
message ClusterPair {
  // How volumes refer to this pair. A single path segment: not empty, not `.` or `..`, and
  // no `/`, since the persistent store key is built from it.
  string id = 1;
  // The name of this side's subtree in the store: everything this cluster writes goes
  // under `<prefix>/dr/<dr-id>/sides/<cluster>/<cluster_uid>/`. The peer's own pair has to
  // carry the same string as its `peer`, or neither side looks where the other writes. A
  // single path segment, for the same reason, and no `.`: a chunk reference joins side,
  // uid and sequence with dots.
  string cluster = 2;
  // This cluster's own identity, as core reads it from the platform. Not configured: it is
  // what actually distinguishes two clusters that were given the same name.
  string cluster_uid = 3;
  // The name of the peer's subtree, which is where this side reads the peer's config and
  // status from. It mirrors the peer's own `cluster`. Named rather than deduced: taking
  // whichever subtree is not ours is only correct while there are exactly two.
  string peer = 4;
  // Where the store is, and how it is reached.
  Transport transport = 5;
}

// Every cluster pair this cluster holds.
//
// Not a page: pairs are cluster-scoped, one per peer relationship, so a cluster has a
// handful and there is nothing to paginate over.
message ClusterPairs {
  // The pairs.
  repeated ClusterPair entries = 1;
}

// Request type for a CreateClusterPair request.
//
// Creating a pair that already exists with the same ends is not an error: an operator
// reconciling the same desired state converges rather than failing on the second pass.
// Where the store is, and the credentials for it, are amended; the two names are not -
// those say which relationship this is, and changing them is a different pair.
message CreateClusterPairRequest {
  // How volumes will refer to this pair. A single path segment: not empty, not `.` or
  // `..`, and no `/`.
  string id = 1;
  // The name of this side's subtree in the store. Not a claim about which cluster this
  // is - that is the uid - so a name other than this cluster's own is allowed, which is
  // what lets one cluster hold both ends of a relationship. It must differ from `peer`.
  string cluster = 2;
  // The name of the peer's subtree, which this side reads from.
  string peer = 3;
  // Where the store is, and how it is reached.
  Transport transport = 4;
}

// Request type for a GetClusterPair request.
message GetClusterPairRequest {
  // The pair to fetch.
  string id = 1;
}

// Request type for a ListClusterPairs request.
message ListClusterPairsRequest {
  // Intentionally empty: a cluster's pairs are returned whole.
}

// Request type for a DestroyClusterPair request.
message DestroyClusterPairRequest {
  // The pair to remove. Removing one that is not there is a not-found.
  string id = 1;
}

// Reply carrying a single cluster pair, or why there is none.
message ClusterPairReply {
  // Either the pair, or the error that stopped it being answered for.
  oneof reply {
    // The pair the request addressed.
    ClusterPair pair = 1;
    // Why there is no pair to return.
    common.ReplyError error = 2;
  }
}

// Reply carrying every cluster pair, or why there are none.
message ClusterPairsReply {
  // Either the pairs, or the error that stopped them being listed.
  oneof reply {
    // The pairs this cluster holds.
    ClusterPairs pairs = 1;
    // Why they could not be listed.
    common.ReplyError error = 2;
  }
}

// Reply to a destroy, carrying only a failure.
message DestroyClusterPairReply {
  // Why the pair was not removed. Absent when it was.
  optional common.ReplyError error = 1;
}

// Which end of a relationship a volume holds. Fixed when replication is enabled: moving a
// volume to the other end is failover or failback, not an edit.
enum Role {
  // Takes the recovery points and uploads them.
  Source = 0;
  // Applies the source's recovery points.
  Destination = 1;
}

// How often a volume is replicated, and for how long its points are kept. The part of an
// entry enabling again may amend.
message Policy {
  // Whether a demoted side found to have diverged discards its un-replicated writes rather
  // than waiting for an operator. Destructive, hence off by default.
  bool auto_resync = 1;
  // How often the source takes a recovery point. Not zero.
  google.protobuf.Duration schedule = 2;
  // How long recovery points are kept. Not zero.
  google.protobuf.Duration ttl = 3;
  // The lag past which the source stops committing. Absent means it never stops.
  optional google.protobuf.Duration max_lag = 4;
}

// A volume's part in a dr relationship.
message Volume {
  // This cluster's volume, which this entry protects: the source volume on the source,
  // the target volume on the destination.
  string volume = 1;
  // The relationship's id, which the store keys everything under: the source volume's
  // uuid when replication was enabled. It never changes: a failover swaps the source and
  // the target, but the id stays.
  string dr = 2;
  // The cluster pair the relationship runs over.
  string pair = 3;
  // The source volume: the one written to, whose points are uploaded to the store. It is
  // `volume` on the source.
  string source_volume = 4;
  // The target volume: the one the source's points are applied to. It is `volume` on the
  // destination. Absent while it is not known.
  optional string target_volume = 5;
  // Which end of the relationship this volume holds.
  Role role = 6;
  // How often, and for how long.
  Policy policy = 7;
  // Lifecycle of this entry: Created while replication is enabled, Deleting once it was
  // disabled and the relationship is waiting to be purged.
  common.SpecStatus status = 8;
}

// Every volume's entry.
message Volumes {
  // The entries.
  repeated Volume entries = 1;
}

// Request type for an EnableVolume request.
//
// Repeating it is not an error, and amends the policy. The pair and the role say which
// relationship this is, so they are not amended: changing them is a different
// relationship.
message EnableVolumeRequest {
  // The volume to protect. It must exist.
  string volume = 1;
  // The cluster pair to replicate over. It must exist.
  string pair = 2;
  // Which end of the relationship this volume holds.
  Role role = 3;
  // How often, and for how long.
  Policy policy = 4;
}

// Request type for a GetVolume request.
message GetVolumeRequest {
  // The volume whose entry to fetch.
  string volume = 1;
}

// Request type for a ListVolumes request.
message ListVolumesRequest {
  // Intentionally empty: every entry is returned.
}

// Request type for a DisableVolume request.
message DisableVolumeRequest {
  // The volume whose entry to remove. Removing one that is not there is a not-found.
  string volume = 1;
}

// Reply carrying a single volume's entry, or why there is none.
message VolumeReply {
  // Either the entry, or the error that stopped it being answered for.
  oneof reply {
    // The entry the request addressed.
    Volume volume = 1;
    // Why there is no entry to return.
    common.ReplyError error = 2;
  }
}

// Reply carrying every volume's entry, or why there are none.
message VolumesReply {
  // Either the entries, or the error that stopped them being listed.
  oneof reply {
    // The entries this cluster holds.
    Volumes volumes = 1;
    // Why they could not be listed.
    common.ReplyError error = 2;
  }
}

// Reply to a disable, carrying only a failure.
message DisableVolumeReply {
  // Why replication was not disabled. Absent when it was.
  optional common.ReplyError error = 1;
}
