syntax = "proto3";

import "v1/misc/common.proto";
import "v1/blockdevice/blockdevice.proto";
import "v1/pool/pool.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

package v1.node;

// Node information
message Node {
  // Node identification
  string node_id = 1;
  // Specification of the node.
  optional NodeSpec spec = 2;
  // Runtime state of the node.
  optional NodeState state = 3;
  // Perceived status of the node.
  optional NodeStatus status = 4;
  // Node metadata.
  optional Metadata meta = 5;
}

message Metadata {
  ResourceTallies tallies = 1;
}

message ResourceTallies {
  /// A tally of all pools configured to reside on this node.
  uint64 pool_count = 1;
  // A tally of all replicas configured to reside on this node.
  // Note that this number may not match the volumes api, as it will include all replicas,
  // configured to reside in the node, sometimes even the failed ones until such time they are deleted.
  uint64 repl_count = 2;
  // A tally of all snapshots configured to reside on this node.
  // Note that this number may not match the volume-snapshots api, as it will include all snapshots,
  // configured to reside in the node, sometimes even the failed ones until such time they are deleted.
  uint64 snap_count = 3;
}

message NodeSpec {
  // Node identification
  string node_id = 1;
  // Endpoint of the io-engine instance (gRPC)
  string endpoint = 2;
  // Node labels.
  common.StringMapValue labels = 3;
  // Drain state
  optional CordonDrainState cordon_drain_state = 4;
  // the host nqn
  optional string node_nqn = 5;
  // the io-engine version
  optional string version = 6;
  // If the node has signaled shutdown by sending deregistration message
  optional bool shutdown = 7;
}

message NodeState {
  // id of the io-engine instance
  string node_id = 1;
  // grpc_endpoint of the io-engine instance
  string endpoint = 2;
  // deemed status of the node
  NodeStatus status = 3;
  // the host nqn
  optional string node_nqn = 4;
  // the io-engine version
  optional string version = 5;
}

// Multiple nodes
message Nodes {
  repeated Node nodes = 1;
}

// Status of the Node
enum NodeStatus {
  // Node has unexpectedly disappeared
  Unknown = 0;
  // Node is deemed online if it has not missed the
  // registration keep alive deadline
  Online = 1;
  // Node is deemed offline if has missed the
  // registration keep alive deadline
  Offline = 2;
}

// Get storage nodes by filter
message GetNodesRequest {
  oneof filter {
    // filter by node id
    common.NodeFilter node = 1;
  }
  // ignore 404 not found errors
  bool ignore_notfound = 2;
}

// Response to the GetNodes request
message GetNodesReply {
  oneof reply {
    Nodes nodes = 1;
    common.ReplyError error = 2;
  }
}

message ProbeRequest {
  // Intentionally empty.
}

message ProbeResponse {
  bool ready = 1;
}

message CordonNodeRequest {
  // Node identification
  string node_id = 1;
  // Node cordon label
  string label = 2;
}

message CordonNodeReply {
  oneof reply {
    Node node = 1;
    common.ReplyError error = 2;
  }
}

message UncordonNodeRequest {
  // Node identification
  string node_id = 1;
  // Node cordon label
  string label = 2;
}

message UncordonNodeReply {
  oneof reply {
    Node node = 1;
    common.ReplyError error = 2;
  }
}

message DrainNodeRequest {
  // Node identification
  string node_id = 1;
  // Node cordon label
  string label = 2;
}

message DrainNodeReply {
  oneof reply {
    Node node = 1;
    common.ReplyError error = 2;
  }
}

message CordonDrainState {
  oneof cordondrainstate {
    CordonedState cordoned = 1;
    DrainState draining = 2;
    DrainState drained = 3;
  }
}

message CordonedState {
  // Cordon information.
  repeated string cordon_labels = 1;
}

message DrainState {
  // Cordon information.
  repeated string cordon_labels = 1;
  // Drain information.
  repeated string drain_labels = 2;
}

message LabelNodeRequest {
  // Node identification
  string node_id = 1;
  // Node label map
  common.StringMapValue label = 2;
  // Overwrite an existing key
  bool overwrite = 3;
}

message LabelNodeReply {
  oneof reply {
    Node node = 1;
    common.ReplyError error = 2;
  }
}

message UnlabelNodeRequest {
  // Node identification
  string node_id = 1;
  // Node label key to remove
  string label_key = 2;
}

message UnlabelNodeReply {
  oneof reply {
    Node node = 1;
    common.ReplyError error = 2;
  }
}

message DeleteNodeRequest {
  // Node identification
  string node_id = 1;
  // Purge node and all its resources without contacting io-engine
  bool purge = 2;
  // Accept deletion of resources (pools, replicas, nexuses, snapshots)
  bool accept = 3;
  // Accept volume loss (last healthy replica)
  bool accept_volume_loss = 4;
  // Accept snapshot loss (last replica snapshot)
  bool accept_snapshot_loss = 5;
}

message NodeDeleteResult {
  // The deleted node ID
  string node_id = 1;
  // Volumes that lost their last healthy replica
  repeated pool.VolumeLossDetail volume_loss = 2;
  // Snapshots that lost their last replica snapshot
  repeated pool.SnapshotLossDetail snapshot_loss = 3;
}

message DeleteNodeReply {
  oneof reply {
    NodeDeleteResult result = 1;
    common.ReplyError error = 2;
  }
}

service NodeGrpc {
  rpc GetNodes (GetNodesRequest) returns (GetNodesReply) {}
  rpc GetBlockDevices (blockdevice.GetBlockDevicesRequest) returns (blockdevice.GetBlockDevicesReply) {}
  rpc Probe (ProbeRequest) returns (ProbeResponse) {}
  rpc CordonNode (CordonNodeRequest) returns (CordonNodeReply) {}
  rpc UncordonNode (UncordonNodeRequest) returns (UncordonNodeReply) {}
  rpc DrainNode (DrainNodeRequest) returns (DrainNodeReply) {}
  rpc LabelNode (LabelNodeRequest) returns (LabelNodeReply) {}
  rpc UnlabelNode (UnlabelNodeRequest) returns (UnlabelNodeReply) {}
  rpc DeleteNode (DeleteNodeRequest) returns (DeleteNodeReply) {}
}
