syntax = "proto3";

import "v1/misc/common.proto";
import "google/protobuf/wrappers.proto";

package v1.pool;

message PoolDiag {
  // The inferred status of the pool.
  PoolStatus status = 1;
  // Errors encountered when importing the pool.
  repeated DiskError import_errors = 2;
  /// Inferred error of the pool, if any.
  optional ProbeError error = 3;
}
message DiskError {
  string disk = 1;
  ProbeError error = 2;
}
enum ProbeErrorCode {
  // Unknown error
  ProbeUnknown = 0;
  // Disk not found in the system
  DiskNotFound = 1;
  // Disk read IO errors
  DiskReadIoError = 2;
  // Pool on-disk name doesn't match the expected
  ForeignPoolName = 3;
  // Pool on-disk uuid doesn't match the expected
  ForeignPoolUid = 4;
  // Failed to check super block error
  SuperBlockIoError = 5;
  // Invalid super block (eg: CRC error)
  InvalidSuperBlock = 6;
  // Disk is a directory (can happen when setting up incorrect volume mounts)
  DiskIsADirectory = 7;
  // Node hosting the pool is offline.
  NodeIsOffline = 8;
  // Node hosting the pool is in unknown state.
  NodeIsUnknown = 9;
  // The pool is cordoned for imports, so it cannot be imported.
  ImportDisabled = 10;
  // Import/Create has timed out.
  TimeOut = 11;
  // If the Disk is already claimed by something.
  // This may happen if the disk is used by another pool for example.
  DiskClaimed = 12;
  // PCI driver not supported.
  PCIDriverUnsupported = 13;
  // PCI still bound to kernel nvme driver.
  PCIKernelBound = 14;
  // PCI BDF exists but it's not an NVMe device.
  PCINotNvme = 15;
  // The disk URI is invalid or not supported.
  InvalidDiskUri = 16;
}
message ProbeError {
  ProbeErrorCode code = 1;
  // additional as human readable
  optional string msg = 2;
}

// An IoEngine Storage Pool
// It may have a spec which is the specification provided by the creator
// It may have a state if such state is retrieved from a io-engine storage node
message Pool {
  // Desired specification of the pool and metadata
  optional PoolDefinition definition = 1;
  // Runtime state of the pool as seen by the dataplane.
  optional PoolState state = 2;
  // Diagnostic information about the pool
  optional PoolDiag diag = 3;
}

// Multiple pools
message Pools {
  repeated Pool pools = 1;
}

// Desired spec and the control plane related data
message PoolDefinition {
  // Client specification of the pool
  PoolSpec spec = 1;
  // Control plane related data for the pool
  Metadata metadata = 2;
}

// uuid and the status of pool spec for the control plane use
message Metadata {
  // uuid of the pool
  google.protobuf.StringValue uuid = 1;
  // spec status of the pool
  common.SpecStatus spec_status = 2;
}

// User specification of a pool.
message PoolSpec {
  // id of the io-engine instance
  string node_id = 1;
  // id of the pool
  string pool_id = 2;
  // absolute disk paths claimed by the pool
  repeated string disks = 3;
  // labels to be set on the pool
  optional common.StringMapValue labels = 5;
  // Encryption details
  optional common.EncryptionSecret secret = 6;
  // Cordon Drain state
  oneof CordonDrain {
    CordonedState cordoned = 7;
  }
  // Blobstore cluster size required for this pool
  optional uint32 cluster_size = 8;
}

// Pool information
message PoolState {
  // id of the io-engine instance
  string node_id = 1;
  // id of the pool
  string pool_id = 2;
  // absolute disk paths claimed by the pool
  repeated string disks_uri = 3;
  // current status of the pool
  PoolStatus status = 4;
  // size of the pool in bytes
  uint64 capacity = 5;
  // used bytes from the pool
  uint64 used = 6;
  // total size of pool replicas
  optional uint64 committed = 7;
  // Is the pool encrypted.
  optional bool encrypted = 8;
  // Blobstore cluster size required for this pool
  optional uint32 cluster_size = 9;
  // Size of the underlying disk, in bytes
  optional uint64 disk_capacity = 10;
  // Maximum disk_capacity this pool can be expanded to, in bytes
  optional uint64 max_expandable_size = 11;
  // Information for each pool disk.
  repeated DiskInfo disk_info = 12;
  // Error information at the pool top-level.
  optional PoolErrors errors = 13;
}

// status of the pool
enum PoolStatus {
  // unknown state
  Unknown = 0;
  // the pool is in normal working order
  Online = 1;
  // the pool has experienced a failure but can still function
  Degraded = 2;
  // the pool is unable to be used
  Faulted = 3;
  // pool is in a suspected state, with warning alerts or higher
  Suspected = 4;
  // pool is in an offline state.
  Offline   = 5;
}

// Get all pools based on the filter criteria
message GetPoolsRequest {
  oneof filter {
    common.NodeFilter node = 1;
    common.PoolFilter pool = 2;
    common.NodePoolFilter node_pool = 3;
    common.CommonFilter common = 4;
  }
}

// Create Pool Request
message CreatePoolRequest {
  // id of the io-engine instance
  string node_id = 1;
  // id of the pool
  string pool_id = 2;
  // disk device paths or URIs to be claimed by the pool
  repeated string disks = 3;
  // labels to be set on the pool
  optional common.StringMapValue labels = 5;
  // Encryption parameters for this pool. Either as raw key params, OR a name to a Kubernetes
  // Secret resource or a file.
  oneof encryption {
    common.EncryptionSecret secret = 6;
  }
  // Blobstore cluster size required for this pool
  optional uint32 cluster_size = 7;
  // Maximum expansion size for this pool
  optional string max_expansion = 8;
}

// Destroy Pool Request
message DestroyPoolRequest {
  // id of the pool
  string pool_id = 1;
  // node id of the pool
  string node_id = 2;
  // Purge mode - delete control plane state without contacting io-engine
  optional bool purge = 3;
  // Accept deletion of pool with replicas
  optional bool accept = 4;
  // Accept volume loss (deleting last healthy replica)
  optional bool accept_volume_loss = 5;
  // Accept snapshot loss (deleting last healthy replica snapshot)
  optional bool accept_snapshot_loss = 6;
}

// Reply type for a CreatePool request
message CreatePoolReply {
  oneof reply {
    Pool pool = 1;
    common.ReplyError error = 2;
  }
  optional PoolDiag poolDiag = 3;
}

// Request type for expand pool
message ExpandPoolRequest {
  // id of the pool
  string pool_id = 1;
}

// Reply type for a ExpandPool request
message ExpandPoolReply {
  oneof reply {
    Pool pool = 1;
    common.ReplyError error = 2;
  }
}

// Result of pool deletion
message PoolDeleteResult {
  // id of the deleted pool
  string pool_id = 1;
  // volume loss information if any volumes lost all healthy replicas
  VolumeLossInfo volume_loss = 2;
  // snapshot loss information if any snapshots lost all healthy replica snapshots
  SnapshotLossInfo snapshot_loss = 3;
}

// Information about volumes that will lose all healthy replicas
message VolumeLossInfo {
  repeated VolumeLossDetail volumes = 1;
}

// Details about data loss for a specific volume
message VolumeLossDetail {
  // The affected volume's unique identifier
  string volume_id = 1;
  // Total number of replicas this volume had across all pools before the deletion
  uint32 replicas_before = 2;
  // Number of those replicas that were healthy (online and fully synced) before deletion
  uint32 healthy_before = 3;
  // Number of this volume's replicas that resided on the pool being purged
  uint32 lost_on_pool = 4;
  // Number of healthy replicas remaining after the purge (0 means total data loss)
  uint32 healthy_after = 5;
}

// Information about snapshots that will lose all healthy replica snapshots
message SnapshotLossInfo {
  repeated SnapshotLossDetail snapshots = 1;
}

// Details about snapshot loss for a specific snapshot
message SnapshotLossDetail {
  // The affected volume snapshot's unique identifier
  string snapshot_id = 1;
  // Total number of replica snapshots across all pools before the deletion
  uint32 replica_snapshots_before = 2;
  // Number of those replica snapshots that were on healthy pools before deletion
  uint32 healthy_before = 3;
  // Number of replica snapshots that resided on the pool being purged
  uint32 lost_on_pool = 4;
  // Number of surviving replica snapshots after the purge (0 means total snapshot loss)
  uint32 healthy_after = 5;
}

// Reply type for a DestroyPool request
message DestroyPoolReply {
  oneof reply {
    PoolDeleteResult result = 1;
    common.ReplyError error = 2;
  }
}

// Reply type for a GetPools request
message GetPoolsReply {
  oneof reply {
    Pools pools = 1;
    common.ReplyError error = 2;
  }
}

// Label Pool request
message LabelPoolRequest {
  // Pool identification
  string pool_id = 1;
  // Pool label map
  map<string, string> labels = 2;
  // Overwrite an existing key
  bool overwrite = 3;
}

// Reply type for a LabelPool request
message LabelPoolReply {
  oneof reply {
    Pool pool = 1;
    common.ReplyError error = 2;
  }
}

message UnlabelPoolRequest {
  // Pool identification
  string pool_id = 1;
  // Pool label key to remove
  string label_key = 2;
}

message UnlabelPoolReply {
  oneof reply {
    Pool pool = 1;
    common.ReplyError error = 2;
  }
}

message CordonPoolRequest {
  optional string node_id = 1;
  string pool_id = 2;
  bool replicas = 3;
  bool snapshots = 4;
  bool restores = 5;
  bool import = 6;
}
message CordonPoolReply {
  oneof reply {
    Pool pool = 1;
    common.ReplyError error = 2;
  }
}

message CordonedState {
  // New replicas can't be created
  bool replicas = 1;
  // New snapshots can't be created
  bool snapshots = 2;
  // New restores can't be created
  bool restores = 3;
  // Pool cannot be imported
  bool import = 4;
}

message PoolErrors {
  // These are generated from the below metrics
  PoolAlerts                    alerts = 1;

  // Disk IO errors
  uint64                io_error_count = 2;
  uint64            io_error_threshold = 3;

  // Disk IO stalls
  bool                      io_stalled = 4;
  uint64     io_stall_transition_count = 5;
  uint64 io_stall_transition_threshold = 6;
}

message PoolAlerts {
  PoolAlertStatus       status = 1;

  // No status alerts are raised
  repeated PoolAlert    notice = 2;
  repeated PoolAlert attention = 3;
  // Warnings downgrades the pool state to Suspected
  repeated PoolAlert   warning = 4;
  // Pools with critical alerts should not be used
  repeated PoolAlert  critical = 5;
}

enum PoolAlertStatus {
  // No issues detected; pool is operating normally
  Healthy   = 0;

  // Non‑critical issues present; user attention is recommended
  Attention = 1;

  // Conditions have exceeded warning thresholds (fixed or based on trends over a defined time window)
  Warning   = 2;

  // Severe issues detected; pool usage should be avoided
  Critical  = 3;

  // Unknown Alert Status
  StatusUnknown = 4;
}

enum PoolAlert {
  // Unrecognized or unsupported alert type
  AlertUnknown           = 0;

  // Pool I/O is currently stalled
  IoStalled              = 1;

  // I/O is not stalled as of now, but stalls have occurred over a defined time window
  IoStallIntermittent    = 2;

  // I/O is not stalled as of now, but stalls have occurred too frequently over a defined time window
  IoStallIntermittentExc = 3;

  // I/O errors have been detected for the pool
  IoError                = 4;

  // I/O errors exceed defined thresholds
  IoErrorExc             = 5;
}

message DiskInfo {
  // The disk uri used to open the disk
  string uri = 1;
  // Errors seen for this disk
  PoolErrors errors = 2;
}

message ClearErrorsRequest {
  // Name of the node
  optional string node_id = 1;

  // Name of the pool
  string pool_id = 2;

  // If one or more disks is specified, only those errors associated with the specified disk or disks are cleared.
  repeated string disks = 3;

  // Error clearing request
  ClearErrors clear = 4;
}

enum ClearErrors {
  // Clears all counted errors and related alerts
  // Example, it clears the io stall transitions, but doesn't clear an io stall
  ClearAll = 0;
}

message ClearErrorsReply {
  oneof reply {
    Pool pool = 1;
    common.ReplyError error = 2;
  }
}

// Service for managing storage pools
service PoolGrpc {
  rpc CreatePool (CreatePoolRequest) returns (CreatePoolReply) {}
  rpc DestroyPool (DestroyPoolRequest) returns (DestroyPoolReply) {}
  rpc GetPools (GetPoolsRequest) returns (GetPoolsReply) {}

  rpc LabelPool (LabelPoolRequest) returns (LabelPoolReply) {}
  rpc UnlabelPool (UnlabelPoolRequest) returns (UnlabelPoolReply) {}

  rpc CordonPool (CordonPoolRequest) returns (CordonPoolReply) {}
  rpc UncordonPool (CordonPoolRequest) returns (CordonPoolReply) {}

  rpc ExpandPool (ExpandPoolRequest) returns (ExpandPoolReply) {}

  // Clear error counters and alerts
  rpc ClearErrors (ClearErrorsRequest) returns (ClearErrorsReply) {}
}
