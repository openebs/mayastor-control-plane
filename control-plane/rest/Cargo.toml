[package]
name = "rest"
description = "Control plane REST server"
version = "1.0.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "rest"
path = "./service/src/main.rs"

[lib]
name = "rest_client"
path = "./src/lib.rs"

[dependencies]
# Actix Server, telemetry
rustls = { workspace = true, default-features = false }
rustls-pemfile = { workspace = true }
actix-web = { workspace = true }
actix-service = { workspace = true }
tracing-actix-web = { workspace = true, features = ["opentelemetry_0_30"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
once_cell = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
clap = { workspace = true, features = ["color", "derive", "env", "string"] }
futures = { workspace = true }
anyhow = { workspace = true }
snafu = { workspace = true }
url = { workspace = true }
http = { workspace = true }
tinytemplate = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
stor-port = { path = "../stor-port" }
utils = { path = "../../utils/utils-lib" }
humantime = { workspace = true }
grpc = { path = "../grpc" }
num_cpus = { workspace = true }
rcgen = { workspace = true }
# certificate file watching for TLS auto-reload; Linux/inotify only
cert-watcher = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
deployer-cluster = { workspace = true }
